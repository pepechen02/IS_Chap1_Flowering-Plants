<title>開花植物 Flowering Plants — 互動測驗</title>
<style>
html,body{margin:0;padding:0;background:#FAF6EC}
@media (prefers-color-scheme:dark){html,body{background:#1B2119}}
#fq{--cream:#FAF6EC;--paper:#FFFFFF;--ink:#24321F;--ink-soft:#5B6B54;--green-deep:#2F6B4F;--green-leaf:#6FA96B;--green-pale:#E4EFDD;--coral:#D6544A;--gold:#E7A93C;--gold-pale:#FCEFD4;--gold-ink:#8A5F13;--wrong:#C24B4B;--wrong-pale:#F8E1DF;--border:#D9D0BC;--shadow:0 6px 18px rgba(47,107,79,0.12);background:var(--cream);color:var(--ink);font-family:Avenir Next,"Segoe UI",ui-sans-serif,system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.55;min-height:100vh}
@media (prefers-color-scheme:dark){#fq{--cream:#1B2119;--paper:#242B22;--ink:#EDEFE7;--ink-soft:#B6C2AC;--green-deep:#8FCBA5;--green-pale:#2C3A29;--coral:#E28B82;--gold:#E7C476;--gold-pale:#3A331F;--gold-ink:#E7C476;--wrong:#E08A82;--wrong-pale:#3A2725;--border:#3B4437;--shadow:0 6px 18px rgba(0,0,0,0.35)}}
#fq *{box-sizing:border-box}
#fq h1,#fq h2,#fq h3{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;font-weight:700;margin:0 0 .3em 0;color:var(--green-deep)}
#fq #app{max-width:760px;margin:0 auto;padding:28px 18px 60px}
#fq .topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px}
#fq .topbar .mark{font-size:34px;line-height:1}
#fq .topbar h1{font-size:22px;margin:0}
#fq .topbar .sub{color:var(--ink-soft);font-size:13px;margin-top:2px}
#fq .hero{background:linear-gradient(160deg,var(--green-pale) 0%,var(--cream) 70%);border:1px solid var(--border);border-radius:22px 22px 8px 22px;padding:20px 22px 18px;margin-bottom:20px}
#fq .hero p{color:var(--ink-soft);font-size:14.5px;max-width:48ch;margin:0}
#fq .overall{margin-top:10px;display:inline-flex;gap:8px;align-items:baseline;background:var(--paper);border:1px solid var(--border);border-radius:999px;padding:6px 14px;font-size:13.5px}
#fq .overall b{color:var(--green-deep);font-size:16px}
#fq .part-heading{margin:24px 0 10px;display:flex;align-items:baseline;gap:10px}
#fq .part-heading .tag{font-size:11.5px;letter-spacing:.02em;background:var(--gold-pale);color:var(--gold-ink);border-radius:6px;padding:2px 8px}

@media (max-width:520px){#fq .module-grid{grid-template-columns:1fr}}
#fq .module-card{text-align:left;background:var(--paper);border:1px solid var(--border);border-radius:16px;padding:16px 16px 14px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s ease;font-family:inherit;color:var(--ink)}

#fq .module-card h3{font-size:16px;margin:8px 0 2px}
#fq .module-card .desc{font-size:12.5px;color:var(--ink-soft);min-height:32px}
#fq .module-card .status{margin-top:10px;font-size:12.5px;display:flex;justify-content:space-between;align-items:center}
#fq .progress-bar-mini{height:6px;border-radius:4px;background:var(--green-pale);overflow:hidden;margin-top:8px}
#fq .progress-bar-mini>div{height:100%;background:var(--green-leaf)}
#fq .badge-score{font-weight:700;color:var(--green-deep)}
#fq .quiz-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
#fq .back-link{background:none;border:none;color:var(--green-deep);font-size:13.5px;cursor:pointer;padding:4px 0;font-family:inherit}
#fq .progress-track{flex:1;height:8px;border-radius:6px;background:var(--green-pale);margin:0 12px;overflow:hidden}
#fq .progress-track>div{height:100%;background:var(--green-leaf);transition:width .25s ease}
#fq .qcount{font-size:12.5px;color:var(--ink-soft);white-space:nowrap}
#fq .card{background:var(--paper);border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
#fq .lvrow{margin-bottom:8px}
#fq .lv{font-size:11.5px;border-radius:6px;padding:2px 8px}
#fq .lv.b{background:var(--green-pale);color:var(--green-deep)}
#fq .lv.a{background:var(--gold-pale);color:var(--gold-ink)}
#fq .prompt{font-size:17px;font-weight:600;margin-bottom:14px}
#fq .diagram-wrap{text-align:center;margin:4px 0 16px}
#fq .flower-diagram{width:100%;max-width:230px;height:auto}
#fq .diagram-caption{font-size:12px;color:var(--ink-soft);margin-top:4px}
#fq .options{display:flex;flex-direction:column;gap:10px;margin-top:4px}

#fq .option-btn .letter{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--ink-soft)}
#fq .option-btn:hover{border-color:var(--green-leaf)}
#fq .option-btn.correct{border-color:var(--green-leaf);background:var(--green-pale)}
#fq .option-btn.correct .letter{background:var(--green-leaf);border-color:var(--green-leaf);color:#fff}
#fq .option-btn.wrong{border-color:var(--wrong);background:var(--wrong-pale)}
#fq .option-btn.wrong .letter{background:var(--wrong);border-color:var(--wrong);color:#fff}

#fq .feedback{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:13.5px}
#fq .feedback.correct{background:var(--green-pale);color:var(--green-deep)}
#fq .feedback.wrong{background:var(--wrong-pale);color:var(--wrong)}
#fq .feedback .verdict{font-weight:700;margin-bottom:4px}
#fq .feedback .explain{color:var(--ink);opacity:.9}
#fq .nav-row{display:flex;justify-content:space-between;margin-top:18px;gap:10px}
#fq .btn{font-family:inherit;border-radius:12px;padding:10px 16px;font-size:14px;cursor:pointer;border:1.5px solid var(--border);background:var(--paper);color:var(--ink)}
#fq .btn:disabled{opacity:.4;cursor:not-allowed}
#fq .btn.primary{background:var(--green-deep);border-color:var(--green-deep);color:#fff}
#fq .btn.primary:disabled{background:var(--green-leaf);border-color:var(--green-leaf);opacity:.45}
#fq .score-banner{text-align:center;background:var(--green-pale);border-radius:18px;padding:22px;margin-bottom:18px}
#fq .score-banner .big{font-size:40px;font-weight:700;color:var(--green-deep);font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif}
#fq .score-banner .pct{color:var(--ink-soft);font-size:13.5px;margin-top:4px}
#fq .qlist{display:flex;flex-direction:column;gap:8px}
#fq .qrow{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:10px 12px;cursor:pointer;font-family:inherit;font-size:13.5px;color:var(--ink);text-align:left;width:100%}
#fq .qrow .num{flex:0 0 auto;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;background:var(--green-pale);color:var(--green-deep)}
#fq .qrow.wrong .num{background:var(--wrong-pale);color:var(--wrong)}
#fq .qrow .qtext{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#fq .qrow .icon{flex:0 0 auto;font-size:14px}
#fq .summary-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
#fq footer.note{text-align:center;color:var(--ink-soft);font-size:12px;margin-top:30px}
#fq .sepal-shape{fill:var(--green-leaf)}
#fq .petal-shape{fill:var(--coral);opacity:.85}
#fq .filament-line{stroke:var(--gold);stroke-width:5}
#fq .anther-shape{fill:var(--gold)}
#fq .style-shape{fill:var(--green-leaf)}
#fq .stigma-shape{fill:#E87A55}
#fq .ovary-shape{fill:var(--green-leaf)}
#fq .ovule-shape{fill:var(--ink);opacity:.6}
#fq .group-hl{fill:none;stroke:var(--gold);stroke-width:3;stroke-dasharray:6 5;animation:fqspin 6s linear infinite}
@keyframes fqspin{to{stroke-dashoffset:-100}}
#fq .is-hl{filter:drop-shadow(0 0 6px var(--gold)) drop-shadow(0 0 2px var(--gold));animation:fqpulse 1.1s ease-in-out infinite}
@keyframes fqpulse{0%,100%{opacity:1}50%{opacity:.55}}
</style>

<script>
(function(){
"use strict";
var MODULES={
 A1:{title:"單字定義 A1",desc:"Science Words 名詞與定義",icon:"🔤"},
 A2:{title:"花的構造 A2",desc:"看圖辨認花的各個部位",icon:"🌼"},
 B1:{title:"課文內容 B1",desc:"花的功能與授粉",icon:"🐝"},
 B2:{title:"課文內容 B2",desc:"受精、果實與種子傳播",icon:"🍅"},
 B3:{title:"課文內容 B3",desc:"發芽、公平測試與綜合進階",icon:"🌱"}
};
var MODULE_ORDER=["A1","A2","B1","B2","B3"];
var GROUPS=[
 {tag:"PART A",title:"單字與定義（基礎）",mods:["A1","A2"]},
 {tag:"PART B",title:"課文內容（含進階）",mods:["B1","B2","B3"]}
];
/* 題目格式：[等級('b'基礎/'a'進階), 題目, [選項…（第一個是正確答案，除非第5欄另有指定）], 中文解說, 正確答案索引(可省略), 看圖部位(可省略)] */
function mk(r){return {lv:r[0],q:r[1],opts:r[2],ex:r[3],a:r[4]||0,dg:r[5]||null};}
var Q={};

Q.A1=[
['b','Which term means “plants that bear flowers”?',['flowering plants','non-flowering plants','seeds','life cycle'],'flowering plants（開花植物）是會長出花的植物，例如玫瑰、雛菊；non-flowering plants（不開花植物）如蕨類、針葉樹則不會開花。'],
['b','What is an anther?',['The male part of a flower that contains pollen grains','The female part of a flower that contains ovules','The part where pollen grains land','The bright parts that surround the flower'],'anther（花藥）是花的雄性部分，裡面裝有花粉粒。含有胚珠的雌性部分是子房（ovary）；花粉落下的地方是柱頭（stigma）；有鮮豔顏色的是花瓣（petals）。'],
['b','Which part of a flower receives pollen?',['stigma','anther','sepal','filament'],'stigma（柱頭）是花粉落下、被接收的地方，屬於雌性部分。anther（花藥）是裝著花粉的地方；sepal（萼片）是花最外層的綠色小片；filament（花絲）是連著花藥的細柄。'],
['b','The ovary contains one or more ___.',['ovules','pollen grains','petals','stigmas'],'ovary（子房）裡有一個或多個 ovules（胚珠），每個胚珠裡有一顆卵（egg）。花粉粒是在花藥裡。'],
['b','What is pollination?',['The transfer of pollen from the anther to the stigma of the same or a different flower','The joining of the pollen and the egg','The scattering of seeds away from the parent plant','The development of a young plant from a seed'],'pollination（授粉／傳粉）＝花粉從花藥傳到同一朵或另一朵花的柱頭。花粉和卵結合叫 fertilisation（受精）；種子被散播到遠處叫 seed dispersal（種子傳播）；種子長成幼苗叫 germination（發芽）。'],
['b','What is fertilisation?',['The process in which the pollen and the egg join','The transfer of pollen by insects','The scattering of seeds','The stages of growth in the life of a living thing'],'fertilisation（受精）是花粉和卵結合的過程，發生在授粉之後。昆蟲搬運花粉屬於授粉；散播種子是 seed dispersal；生物一生的成長階段是 life cycle。'],
['b','What is germination?',['The development of a plant from a seed','The transfer of pollen to the stigma','The joining of pollen and egg','The scattering of seeds'],'germination（發芽）是種子長成植物的過程。授粉、受精、種子傳播都發生在花或果實這一段，發芽則是從種子開始。'],
['b','What is seed dispersal?',['The scattering of seeds away from the parent plant','The development of a plant from a seed','The transfer of pollen between flowers','The swelling of the ovary into a fruit'],'seed dispersal（種子傳播）是把種子散播到離母株較遠的地方，讓新植物有足夠的水、光和空間。'],
['b','What is a life cycle?',['The stages of growth and development in the life of a living thing','A machine that helps to pollinate flowers','The parts of a flower that help it reproduce','A measure of how hot or cold something is'],'life cycle（生命週期）是生物一生中成長與發育的各個階段，這些階段會循環重複。開花植物：種子 → 幼苗 → 幼株 → 成株，再回到種子。'],
['b','Which statement is correct?',['The stamen includes the male parts and the carpel includes the female parts','The stamen includes the female parts and the carpel includes the male parts','Both the stamen and the carpel are male parts','Both the stamen and the carpel are female parts'],'stamen（雄蕊）包含雄性部分（花絲、花藥）；carpel（雌蕊）包含雌性部分（柱頭、花柱、子房）。'],
['b','Which word means “花瓣” in English?',['petals','sepals','stigma','ovules'],'petals 是花瓣，通常有鮮豔的顏色。sepal 是萼片；stigma 是柱頭；ovule 是胚珠。'],
['b','Temperature is ___.',['a measure of how hot or cold something is','the amount of water in the soil','the amount of light a plant receives','the number of seeds in a fruit'],'temperature（溫度）是衡量物體有多熱或多冷。種子發芽需要空氣、水和適合的溫度，太高或太低都可能不發芽。']
].map(mk);

Q.A2=[
['b','Look at the diagram. The glowing part is where pollen grains land. What is it called?',['stigma','anther','ovary','sepal'],'發光處是柱頭（stigma），是花粉粒降落、附著的地方，也是授粉的起點。',0,'stigma'],
['b','Which glowing part contains the pollen grains?',['anther','stigma','filament','ovule'],'發光處是花藥（anther），裡面裝著花粉粒；花藥長在花絲的頂端。',0,'anther'],
['b','The glowing thin stalk holds up the anther. What is it called?',['filament','style','sepal','petal'],'支撐花藥的細長柄叫花絲（filament）；花絲加上花藥合稱雄蕊（stamen）。',0,'filament'],
['b','This glowing bulb-shaped part contains one or more ovules. What is it?',['ovary','anther','stigma','sepal'],'發光的膨大部位是子房（ovary），裡面有一個或多個胚珠（ovule）。受精後子房會發育成果實。',0,'ovary'],
['b','The tiny glowing dot inside the ovary contains an egg. What is it?',['ovule','stigma','filament','petal'],'子房裡面的小構造是胚珠（ovule），每個胚珠含有一顆卵（egg）。受精後胚珠會發育成種子。',0,'ovule'],
['b','The glowing tube connects the stigma to the ovary. What is it called?',['style','filament','stamen','sepal'],'連接柱頭和子房的細長管狀部分叫花柱（style），花粉管會沿著它往下長到子房。',0,'style'],
['b','The glowing green, leaf-like parts at the base of the flower are called the ___.',['sepal','petal','stigma','ovary'],'位於花最外圈基部、像小綠葉的部分是萼片（sepal）。',0,'sepal'],
['b','The glowing colourful part that surrounds the male and female parts is the ___.',['petal','sepal','stigma','ovary'],'包圍雄性和雌性部位、顏色鮮豔的是花瓣（petal），用來吸引昆蟲幫忙傳粉。',0,'petal'],
['b','The glowing group of parts (the anther and its filament together) is called the ___.',['stamen','carpel','sepal','ovary'],'花絲加上花藥合稱雄蕊（stamen），是花的雄性部分。',0,'stamen_group'],
['b','The glowing group of parts (stigma, style and ovary together) is called the ___.',['carpel','stamen','sepal','petal'],'柱頭、花柱和子房合稱雌蕊（carpel），是花的雌性部分。',0,'carpel_group'],
['b','Which two parts belong to the stamen?',['filament and anther','stigma and style','ovary and ovule','petal and sepal'],'雄蕊（stamen）由花絲（filament）和花藥（anther）組成。柱頭、花柱、子房屬於雌蕊（carpel）。'],
['b','Which parts belong to the carpel?',['stigma, style and ovary','filament and anther','petal and sepal','anther, style and ovule'],'carpel（雌蕊）包含 stigma（柱頭）、style（花柱）、ovary（子房）。filament 和 anther 屬於雄蕊。']
].map(mk);

Q.B1=[
['b','Which of these is a non-flowering plant?',['fern','rose','daisy','sunflower'],'fern（蕨類）是不開花植物，和針葉樹（conifers）一樣。rose（玫瑰）、daisy（雛菊）、sunflower（向日葵）都會開花。'],
['b','Flowers are the ___ parts of a plant.',['reproductive','food-making','water-absorbing','supporting'],'花是植物的生殖器官（reproductive parts），幫助植物繁殖。葉子負責製造養分；根和莖負責吸水與支撐。'],
['b','The petals of a flower surround its ___.',['male and female parts','roots and stems','seeds and fruits','leaves only'],'花瓣圍繞在花的雄性部分（雄蕊）和雌性部分（雌蕊）外面。'],
['b','What does the anther contain?',['pollen grains','ovules','an egg','seeds'],'anther（花藥）含有花粉粒，花粉是很小的粉狀顆粒。ovule（胚珠）和 egg（卵）在子房裡。'],
['b','Each ovule contains ___.',['an egg','a pollen grain','a petal','a stigma'],'子房裡有一個或多個胚珠（ovules），每個胚珠裡有一顆卵（egg）。受精時花粉會和這顆卵結合。'],
['b','Why are the petals of some flowers brightly coloured?',['To attract insects that transfer pollen','To make food for the plant','To absorb water from the soil','To store the seeds'],'鮮豔的花瓣能吸引昆蟲；昆蟲會把花粉從雄性部分帶到雌性部分，幫助植物繁殖。製造養分是葉子的工作。'],
['a','A yellow daffodil and a dull, feathery grass-like plant grow side by side. Which is more likely to attract insects, and why?',['The daffodil, because its petals are large and brightly coloured','The grass-like plant, because its flowers are feathery','Both attract the same number of insects','Neither, because insects only visit leaves'],'色彩鮮豔、花瓣顯眼的水仙（daffodil）更容易吸引昆蟲。像禾草一樣不起眼的花，通常較常靠風傳粉，不需要用花瓣吸引昆蟲。'],
['a','Why does the textbook use a labelled diagram as a model of a flower?',['Some flowers look different, so a model shows the common features','All flowers look exactly the same','Real flowers cannot be observed','A model is always more colourful than a real flower'],'課本說：因為不同的花外觀不同，模型（model）只呈現大家共有的重要特徵，幫助我們理解。這也對應「model 能顯示物體重要特徵」這個學習目標。'],
['a','How do insects and birds help with pollination?',['Pollen sticks to their bodies and is carried from one flower to another','They eat all the pollen so that it cannot spread','They plant seeds into the soil','They make the petals grow brighter'],'昆蟲和鳥在花間移動時，花粉會沾到牠們身上，因此能把花粉從花藥帶到柱頭，完成授粉。'],
['a','Why can the wind carry pollen from one flower to another easily?',['The pollen grains are light','The pollen grains are large and heavy','The pollen grains are brightly coloured','The pollen grains stick to insects'],'有些花靠風傳粉，因為花粉粒很輕，容易被風吹送到另一朵花。'],
['a','A field of bright red and yellow tulips is useful for which process?',['pollination','germination','seed dispersal','fertilisation'],'色彩鮮豔的花能吸引昆蟲，幫忙把花粉帶到柱頭，這個過程是 pollination（授粉）。（課本 Practice Worksheet 第 3 題）']
].map(mk);

Q.B2=[
['b','After pollination, the pollen and the egg join in a process called ___.',['fertilisation','germination','seed dispersal','life cycle'],'授粉後，花粉和卵結合的過程叫 fertilisation（受精）。'],
['b','When a pollen grain lands on the stigma, it develops a tiny ___.',['pollen tube','root','leaf','petal'],'花粉粒落在柱頭後，會長出一條細小的 pollen tube（花粉管）。'],
['b','The pollen tube grows downwards into the ___.',['ovary','anther','sepal','petal'],'花粉管向下生長，進入子房（ovary），到達胚珠裡的卵。'],
['a','Which is the correct order of fertilisation?',['Pollen lands on the stigma → pollen tube grows into the ovary → pollen and egg join','Pollen and egg join → pollen lands on the stigma → pollen tube grows','Pollen tube grows → egg joins → pollen lands on the stigma','Egg joins → pollen tube grows → pollen lands on the stigma'],'順序是：1) 花粉落在柱頭並長出花粉管；2) 花粉管向下長入子房；3) 花粉與卵結合，完成受精。'],
['b','What happens to the ovary after fertilisation?',['It swells and develops into a fruit','It turns into a pollen grain','It falls off with the petals','It becomes the stigma'],'受精後子房會膨大（swells），發育成果實（fruit）。'],
['b','After fertilisation, the ovules develop into ___.',['seeds','petals','pollen grains','roots'],'受精後，胚珠（ovules）發育成種子（seeds），種子包在果實裡面。'],
['b','What happens to the petals and the stamen after fertilisation?',['They wither and fall off','They grow bigger','They turn into seeds','They become the ovary'],'受精後花瓣和雄蕊會枯萎（wither）並掉落，接著子房膨大成果實。'],
['a','Which describes the development of a tomato correctly?',['Petals and stamen wither → ovary swells into a green fruit → fruit ripens and turns red','Green fruit ripens → petals wither → ovary swells','Ovary swells → pollen lands on the stigma → petals wither','Fruit ripens → ovary swells → stamen withers'],'課本圖：先是花瓣和雄蕊枯萎掉落 → 子房膨大成綠色果實（胚珠變成種子）→ 果實完全發育並成熟（ripens），顏色變紅。'],
['b','Which list shows the ways seeds can be dispersed?',['wind, water, animals, explosion','wind, water, sunlight, soil','animals, heat, light, air','explosion, magnets, water, sunlight'],'課本列出的種子傳播方式：風（wind）、水（water）、動物（animals）、爆裂（explosion）。'],
['a','Why do seeds need to be scattered away from the parent plant?',['To avoid overcrowding, so plants get enough water, light and space','To make the fruit bigger','To attract more insects','To help the petals stay bright'],'離母株太近會過度擁擠（overcrowding），植物要互相競爭水、光和空間，可能長不好甚至死亡；散播讓新植物有足夠的資源。'],
['a','Maple seeds have thin, wing-like parts. Which method of dispersal are they most likely to use?',['wind','water','animals','explosion'],'楓樹（maple）種子有像翅膀的薄片，能被風帶著飄遠，屬於風力傳播。可以用「特徵配合方式」來推測：風 → 輕、有翅或絨毛；水 → 能漂浮；動物 → 有鉤刺或被吃掉；爆裂 → 果實裂開把種子彈出。'],
['a','Spanish needles seeds have sharp, hooked tips. Which method of dispersal is most likely?',['animals','wind','water','explosion'],'帶尖刺或小鉤的種子容易黏在動物的毛或人的衣服上，被帶到遠處，屬於動物傳播。（課本活動：Spanish needles）'],
['a','Which statement is false?',['Seeds are dispersed only by animals','The anther contains pollen grains','The ovary develops into a fruit after fertilisation','Some flowers have brightly coloured petals to attract insects'],'錯的是「種子只靠動物傳播」，實際上還有風、水、爆裂。其他三句都正確。（課本 Practice Worksheet 第 1 題）']
].map(mk);

Q.B3=[
['b','Which set of conditions do seeds need to germinate?',['air, water and a suitable temperature','light, soil and fertiliser','sunlight, wind and insects','water, darkness and cold'],'課本：種子發芽需要空氣（air）、水（water）和適合的溫度（temperature）。溫度太高或太低，種子都可能不發芽。'],
['b','True or false: Seeds need light to germinate.',['True','False'],'False（錯誤）。課本列出的發芽條件是空氣、水和適合的溫度，不包含光。（課本 Practice Worksheet 第 1 題）',1],
['b','What happens first when a seed germinates?',['The seed absorbs water','The first leaves appear','The leaves start to make food','The stem grows upwards'],'發芽第一步是種子吸水（absorbs water）。接著根向下長，莖向上長，最後長出葉子並開始製造養分。'],
['a','Many food plants depend on pollination, but honeybee numbers are falling. Why is this a problem?',['Fewer flowers may be pollinated, so less food may be produced','Bees are needed to water the plants','Bees make the seeds germinate','Flowers cannot grow without being eaten by bees'],'蜜蜂是重要的傳粉者，數量減少會讓較少的花被授粉，糧食產量可能不足，所以要想其他授粉方式（例如設計授粉機器）。（課本 Problem-based Learning）'],
['a','Which is the correct order of how a seed germinates?',['Seed absorbs water → root grows downwards → stem grows upwards → first leaves appear → leaves make food','Root grows downwards → seed absorbs water → first leaves appear → stem grows upwards','Seed absorbs water → first leaves appear → root grows downwards → leaves make food','Stem grows upwards → seed absorbs water → root grows downwards → first leaves appear'],'課本順序：1) 種子吸水 2) 根向下長 3) 更多根長出，莖開始伸出地面 4) 莖向上長 5) 第一批葉子出現 6) 葉子開始製造養分。'],
['a','Reza and Vinit put bean seeds in identical pots of soil with equal water. Reza’s pot stayed in the refrigerator and the seeds did not germinate. Give one reason why.',['The temperature was too low','There was too much soil','The seeds did not need water','The pot was too big'],'兩盆的盆子、土、水量都相同，只有放置地點（溫度）不同：Reza 的放在冰箱，溫度太低所以沒發芽；Vinit 放在窗台，溫度合適所以發芽。'],
['a','In Reza and Vinit’s test, which variable was changed?',['The place (temperature) where the pot was kept','The amount of water','The type of pot','The type of seeds'],'公平測試中「被改變的變因」（自變因）是放置地點／溫度：冰箱 vs 窗台。水量、盆子、土壤、種子種類都要保持一樣。'],
['a','In the same test, which variable was measured or observed?',['Whether the seeds germinated','The amount of water','The place where the pot was kept','The size of the pot'],'被測量／觀察的變因（應變因）是「種子有沒有發芽」，用來看改變溫度造成的結果。'],
['a','In the same test, which variable was kept the same?',['The amount of water given','The temperature of the place','Whether the seeds germinated','The place where the pot was kept'],'被控制（保持相同）的變因（控制變因）是給的水量，還有相同的盆子和土壤，這樣才能確定差異是溫度造成的。三種變因：改變的、測量的、保持相同的。'],
['a','You want a fair test to find out if seeds need water to grow. What should you change?',['Only the amount of water','The amount of water and the temperature','The type of seed and the amount of water','The pot, soil and water'],'公平測試（fair test）一次只改變一個變因：水量（有水 vs 沒水），其他如種子種類、溫度、盆子、土壤都要保持相同。'],
['a','You predicted that seeds without water would not germinate. The results showed no germination without water. What does this show?',['The prediction was accurate','The prediction was not accurate','The test was not fair','Seeds do not need air'],'預測與結果相符，表示預測是準確的（accurate）。若結果不同，就要說明預測不準確，並想想可以怎麼改進實驗。'],
['a','What do agronomists do?',['They study how plants can be grown in different ways to improve the quality and quantity of plants','They study only insects that live on flowers','They design machines to sell fruits','They study how animals disperse seeds'],'農藝學家（agronomist）研究植物的不同種植方式，提升作物（尤其是糧食作物）的品質和產量，也做實驗讓植物更耐久、能在惡劣環境中生存。（課本 Science at Work）'],
['b','Which is the correct order of the life cycle of a flowering plant?',['seed → seedling → young plant → adult plant','seedling → seed → adult plant → young plant','adult plant → seed → young plant → seedling','young plant → seed → seedling → adult plant'],'生命週期圖：seed（種子）→ seedling（幼苗）→ young plant（幼株）→ adult plant（成株），成株再產生種子，形成循環（cycle）。']
].map(mk);

var KEY="fp_quiz_v2";
function shuf(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b;}
function newRec(item){var ord=item.opts.map(function(_,i){return i;});if(ord.length>2)ord=shuf(ord);return {sel:null,correct:null,ord:ord};}
function fresh(m){return Q[m].map(newRec);}
function loadState(){try{var raw=localStorage.getItem(KEY);if(raw)return JSON.parse(raw);}catch(e){}return {};}
function saveState(){try{localStorage.setItem(KEY,JSON.stringify(progress));}catch(e){}}
var progress=loadState();
MODULE_ORDER.forEach(function(m){
 var p=progress[m];
 var ok=Array.isArray(p)&&p.length===Q[m].length&&p.every(function(r,i){return r&&Array.isArray(r.ord)&&r.ord.length===Q[m][i].opts.length;});
 if(!ok)progress[m]=fresh(m);
});

var view="home",curModule=null,curIndex=0,summaryFrom=false;
var appEl=document.getElementById("app");

function moduleScore(m){
 var arr=progress[m];
 return {answered:arr.filter(function(r){return r.sel!==null;}).length,correct:arr.filter(function(r){return r.correct===true;}).length,total:arr.length};
}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}

function flowerSVG(hl){
 function on(n){return hl===n?"is-hl":"";}
 var g="";
 if(hl==="stamen_group"){g='<ellipse cx="150" cy="255" rx="58" ry="108" class="group-hl"></ellipse>';}
 else if(hl==="carpel_group"){g='<ellipse cx="200" cy="272" rx="52" ry="112" class="group-hl"></ellipse>';}
 return ''+
 '<svg viewBox="0 0 400 420" class="flower-diagram" aria-hidden="true">'+
 '<g class="sepal '+on("sepal")+'"><path class="sepal-shape" d="M170,382 L138,338 L163,380 Z"></path><path class="sepal-shape" d="M230,382 L262,338 L237,380 Z"></path></g>'+
 '<g class="petal '+on("petal")+'"><path class="petal-shape" d="M200,378 C118,338 66,226 88,146 C132,188 192,258 200,378 Z"></path><path class="petal-shape" d="M200,378 C282,338 334,226 312,146 C268,188 208,258 200,378 Z"></path></g>'+
 '<g class="stamen">'+
 '<line x1="170" y1="345" x2="150" y2="182" class="filament-line '+on("filament")+'"></line>'+
 '<ellipse cx="150" cy="172" rx="15" ry="11" class="anther-shape '+on("anther")+'"></ellipse>'+
 '<line x1="230" y1="345" x2="250" y2="182" class="filament-line"></line>'+
 '<ellipse cx="250" cy="172" rx="15" ry="11" class="anther-shape"></ellipse></g>'+
 '<g class="carpel">'+
 '<ellipse cx="200" cy="356" rx="30" ry="23" class="ovary-shape '+on("ovary")+'"></ellipse>'+
 '<circle cx="200" cy="358" r="6" class="ovule-shape '+on("ovule")+'"></circle>'+
 '<rect x="196" y="192" width="8" height="158" class="style-shape '+on("style")+'"></rect>'+
 '<path d="M178,192 C178,164 222,164 222,192 C210,180 190,180 178,192 Z" class="stigma-shape '+on("stigma")+'"></path></g>'+
 g+'</svg>';
}

function renderHome(){
 var ta=0,tc=0,tt=0,all=true;
 MODULE_ORDER.forEach(function(m){var s=moduleScore(m);ta+=s.answered;tc+=s.correct;tt+=s.total;if(s.answered<s.total)all=false;});
 var overall="";
 if(ta>0){overall='<div class="overall">已作答 <b>'+ta+'</b> / '+tt+' 題　·　'+(all?'總分':'目前答對')+' <b>'+tc+'</b>'+(all?' / '+tt:'')+'</div>';}
 function card(m){
  var meta=MODULES[m],s=moduleScore(m),arr=Q[m];
  var bn=arr.filter(function(x){return x.lv==='b';}).length,an=arr.length-bn;
  var pct=s.total?Math.round(s.answered/s.total*100):0;
  var st=s.answered===0?"尚未開始":(s.answered<s.total?("進行中 "+s.answered+"/"+s.total):("完成 · "+s.correct+"/"+s.total+" 分"));
  return '<button class="module-card" data-module="'+m+'"><div class="icon">'+meta.icon+'</div><h3>'+esc(meta.title)+'</h3><div class="desc">'+esc(meta.desc)+'（'+arr.length+' 題：基礎 '+bn+'／進階 '+an+'）</div><div class="progress-bar-mini"><div style="width:'+pct+'%"></div></div><div class="status"><span>'+esc(st)+'</span>'+(s.answered===s.total&&s.total>0?'<span class="badge-score">'+s.correct+'/'+s.total+'</span>':'')+'</div></button>';
 }
 var groups=GROUPS.map(function(g){
  return '<div class="part-heading"><span class="tag">'+g.tag+'</span><h2 style="font-size:16px;margin:0;">'+g.title+'</h2></div><div class="module-grid">'+g.mods.map(card).join("")+'</div>';
 }).join("");
 appEl.innerHTML=
 '<div class="topbar"><div class="mark">🌼</div><div><h1>開花植物 Flowering Plants</h1><div class="sub">互動測驗 · Chapter 1</div></div></div>'+
 '<div class="hero"><h2 style="font-size:17px;margin-bottom:6px;">選一個單元開始作答</h2><p>每個單元答完一題就會立刻顯示對錯與中文解說。可以分批完成，進度會自動保留，隨時回首頁換一個單元。</p>'+overall+'</div>'+
 groups+
 '<footer class="note">依課本《Flowering Plants》單元內容自製練習，僅供學習使用。</footer>';
 Array.prototype.forEach.call(appEl.querySelectorAll(".module-card"),function(btn){
  btn.addEventListener("click",function(){
   curModule=btn.getAttribute("data-module");
   var idx=progress[curModule].findIndex(function(r){return r.sel===null;});
   summaryFrom=false;
   if(idx===-1){view="summary";}else{curIndex=idx;view="quiz";}
   render();
  });
 });
}

function renderQuiz(){
 var list=Q[curModule],item=list[curIndex],rec=progress[curModule][curIndex];
 var answered=rec.sel!==null,total=list.length,pct=Math.round((curIndex+1)/total*100);
 var optionsHtml=rec.ord.map(function(oi,k){
  var cls="option-btn";
  if(answered){cls+=" disabled";if(oi===item.a)cls+=" correct";else if(oi===rec.sel)cls+=" wrong";else cls+=" dim";}
  return '<button class="'+cls+'" data-idx="'+oi+'"><span class="letter">'+String.fromCharCode(65+k)+'</span><span>'+esc(item.opts[oi])+'</span></button>';
 }).join("");
 var dg="";
 if(item.dg){dg='<div class="diagram-wrap">'+flowerSVG(item.dg)+'<div class="diagram-caption">🔍 請觀察圖中發光標示的部位</div></div>';}
 var fb="";
 if(answered){
  fb='<div class="feedback '+(rec.correct?"correct":"wrong")+'"><div class="verdict">'+(rec.correct?"✅ 答對了！":"❌ 答錯了，正確答案是「"+esc(item.opts[item.a])+"」")+'</div><div class="explain">'+esc(item.ex)+'</div></div>';
 }
 var isLast=curIndex===total-1;
 var nextLabel=summaryFrom?"返回總覽":(isLast?"完成本單元 →":"下一題 →");
 appEl.innerHTML=
 '<div class="quiz-header"><button class="back-link" id="btnBack">← '+(summaryFrom?"返回總覽":"回首頁")+'</button><div class="progress-track"><div style="width:'+pct+'%"></div></div><div class="qcount">第 '+(curIndex+1)+' / '+total+' 題</div></div>'+
 '<div class="card"><div class="lvrow"><span class="lv '+item.lv+'">'+(item.lv==='b'?'基礎':'進階')+'</span></div>'+dg+'<div class="prompt">'+esc(item.q)+'</div><div class="options">'+optionsHtml+'</div>'+fb+'</div>'+
 '<div class="nav-row"><button class="btn" id="btnPrev" '+(curIndex===0?"disabled":"")+'>← 上一題</button><button class="btn primary" id="btnNext" '+(!answered?"disabled":"")+'>'+nextLabel+'</button></div>';
 appEl.querySelector("#btnBack").addEventListener("click",function(){view=summaryFrom?"summary":"home";summaryFrom=false;render();});
 appEl.querySelector("#btnPrev").addEventListener("click",function(){if(curIndex>0){curIndex-=1;render();}});
 appEl.querySelector("#btnNext").addEventListener("click",function(){
  if(summaryFrom){view="summary";summaryFrom=false;render();return;}
  if(isLast){view="summary";render();return;}
  curIndex+=1;render();
 });
 if(!answered){
  Array.prototype.forEach.call(appEl.querySelectorAll(".option-btn"),function(btn){
   btn.addEventListener("click",function(){
    var idx=parseInt(btn.getAttribute("data-idx"),10);
    rec.sel=idx;rec.correct=(idx===item.a);saveState();render();
   });
  });
 }
}

function renderSummary(){
 var list=Q[curModule],arr=progress[curModule];
 var correct=0,bc=0,bt=0,ac=0,at=0;
 list.forEach(function(it,i){var ok=arr[i].correct===true;if(ok)correct++;if(it.lv==='b'){bt++;if(ok)bc++;}else{at++;if(ok)ac++;}});
 var total=list.length,pct=Math.round(correct/total*100);
 var lvText='基礎 '+bc+'/'+bt+(at?'　·　進階 '+ac+'/'+at:'');
 var rows=list.map(function(it,idx){
  var rec=arr[idx];
  var wrong=rec.sel!==null&&!rec.correct;
  var icon=rec.sel===null?"⬜":(rec.correct?"✅":"❌");
  return '<button class="qrow '+(wrong?"wrong":"")+'" data-idx="'+idx+'"><span class="num">'+(idx+1)+'</span><span class="qtext">'+esc(it.q)+'</span><span class="icon">'+icon+'</span></button>';
 }).join("");
 appEl.innerHTML=
 '<div class="quiz-header"><button class="back-link" id="btnBack">← 回首頁</button><div class="qcount">'+esc(MODULES[curModule].title)+'</div></div>'+
 '<div class="score-banner"><div class="big">'+correct+' / '+total+'</div><div class="pct">答對率 '+pct+'%　·　'+lvText+'</div></div>'+
 '<div class="qlist">'+rows+'</div>'+
 '<div class="summary-actions"><button class="btn" id="btnRetake">🔄 重新測驗這個單元</button><button class="btn primary" id="btnHome2">回首頁</button></div>';
 appEl.querySelector("#btnBack").addEventListener("click",function(){view="home";render();});
 appEl.querySelector("#btnHome2").addEventListener("click",function(){view="home";render();});
 appEl.querySelector("#btnRetake").addEventListener("click",function(){
  progress[curModule]=fresh(curModule);saveState();curIndex=0;summaryFrom=false;view="quiz";render();
 });
 Array.prototype.forEach.call(appEl.querySelectorAll(".qrow"),function(btn){
  btn.addEventListener("click",function(){curIndex=parseInt(btn.getAttribute("data-idx"),10);summaryFrom=true;view="quiz";render();});
 });
}

function render(){
 window.scrollTo(0,0);
 if(view==="home")renderHome();
 else if(view==="quiz")renderQuiz();
 else renderSummary();
}
render();
})();
</script>
</body>
</html>
